name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - beta
      - 純清點作業版

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-site
        continue-on-error: true

      - name: Checkout pure-check branch
        uses: actions/checkout@v4
        with:
          ref: 純清點作業版
          path: check-only-site
        continue-on-error: true

      - name: Prepare deployment directory
        run: |
          mkdir -p public
          # Copy main site to root
          if [ -d "main-site" ]; then
            cp -r main-site/* public/
          fi
          
          # If beta branch exists, copy it to /beta/
          if [ -d "beta-site" ]; then
            mkdir -p public/beta
            cp -r beta-site/* public/beta/
          fi

          # If 純清點作業版 branch exists, copy it to /check-only/ and /check/
          if [ -d "check-only-site" ]; then
            mkdir -p public/check-only
            cp -r check-only-site/* public/check-only/
            mkdir -p public/check
            cp -r check-only-site/* public/check/
          fi
          
          # Clean up any potential git internal folders copied
          rm -rf public/.git || true
          rm -rf public/beta/.git || true
          rm -rf public/check-only/.git || true
          rm -rf public/check/.git || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
